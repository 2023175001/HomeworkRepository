<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="main.css" />
    <title>signup</title>
  </head>
  <body>
    <h1>Welcome to INTERNET-PROGRAMMING MOVIE SITE</h1>
    <nav class="nav">
      <a href="login.html">로그인</a>
      <span>회원가입</span>
    </nav>
    <form method="post" action="#" class="form form-signup">
      <div class="form-input">
        <p>
          <label>
            이름:
            <input type="text" name="name" autofocus required />
          </label>
        </p>
        <p>
          <label>
            생일:
            <input type="date" name="birthday" required />
          </label>
        </p>
        <p>
          성별:
          <label>
            <input type="radio" name="gender" value="male" required />
            남성
          </label>
          <label>
            <input type="radio" name="gender" value="female" required />
            여성
          </label>
        </p>
        <p>
          <label>
            학년:
            <input
              type="number"
              name="grade"
              min="1"
              max="4"
              step="1"
              value="1"
            />
          </label>
        </p>
        <p>
          <label>
            아이디:
            <input type="text" name="username" required />
          </label>
        </p>
        <p>
          <label>
            비밀번호:
            <input
              type="password"
              name="password"
              autocomplete="new-password"
              required
            />
          </label>
        </p>
        <p>
          <label>
            이메일:
            <input
              type="email"
              name="email"
              placeholder="example@gmail.com"
              required
            />
          </label>
        </p>
        <p>
          <label>
            보안 질문:
            <select name="security-question" required>
              <option selected>질문을 선택하세요</option>
              <option>나의 출신 지역은 어디인가요?</option>
              <option>가장 좋아하는 음식은 무엇인가요?</option>
              <option>좋아하는 책은 무엇인가요?</option>
            </select>
          </label>
        </p>
        <p>
          <label>
            답변:
            <input type="text" name="security-answer" required />
          </label>
        </p>
      </div>
      <div class="form-btn">
        <input type="submit" class="btn btn-signup" value="Signup" />
        <input
          type="submit"
          formnovalidate
          class="btn btn-cancel"
          value="Cancel"
        />
      </div>
    </form>
  </body>
</html>
